<!DOCTYPE html>
<html lang="en">
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="new account">
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<title>
		Create Account
	</title>

</head>
<body>

	<main class="logo">
		<img src="mustlogo.jpg" alt="MUST logo">
	</main>

	<p class="uni_name">MBARARA UNIVERSITY OF SCIENCE AND TECHNOLOGY</p>

	<main class="Create Account">   
		<section class="card">
			<h2>Create Account</h2>
			<form method="POST" action="/application">
				<label for="name">Full Name</label>
				<div class="input-group">
					<i class="fa-solid fa-user icon"></i>
					<input type="text" id="name" name="name" placeholder="Enter full name" required></div>

				<label for="email">Email Address</label>
			<div class="input-group">
				<i class="fa-solid fa-envelope icon"></i>
				<input type="email" id="email" name="email" placeholder="Enter Email" required>
			</div>

				<label for="password">Password</label>
				<div class="input-group">
					<i class="fa-solid fa-lock icon"></i>
					<input type="password" id="password" name="password" placeholder="Enter Password" required ></div>

				<label for="confirm_password">Confirm Password</label>
				<div class="input-group">
					<i class="fa-solid fa-lock icon"></i>
					<input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required ></div>

				<button type="submit" class="btn-primary">
					<i class="fa-solid fa-right-to-bracket "></i>
				Create Account </button>

				<p class="auth-switch">Already have an account? <a href="/login">Login here</a></p>

			</form>
		</section>
	</main>
	<script src="/js/new_account.js"></script>
</body>
</html>
